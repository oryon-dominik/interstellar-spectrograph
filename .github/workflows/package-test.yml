# The package's own gate, beside the hygiene workflow (ci.yml): lint,
# format and the test suite against the locked dependencies.
name: Test

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  # The release workflow runs this gate before it mints a number.
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # No setup-python step: uv resolves the interpreter from requires-python and
      # downloads it if missing.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0

      - name: Install
        # Groups as well as extras: a public library keeps its tools in dependency groups,
        # which no consumer installs.
        run: uv sync --all-extras --all-groups --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest
