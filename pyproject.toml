[project]
name = "cyberise-spectrograph"
version = "2026.11.1"
description = "Responsive images for the web: renditions made on first request, srcset, cache-forever URLs, a Django view included."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pillow>=12.3.0",
]
license = "MIT"
license-files = ["LICENSE"]
# The wheel names whoever its LICENSE names.
authors = [{ name = "cyberise GmbH", email = "hallo+legal@cyberise.de" }]
keywords = ["responsive-images", "srcset", "image-resizing", "webp", "avif", "pillow", "django"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Typing :: Typed",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
repository = "https://github.com/oryon-dominik/interstellar-spectrograph"
changelog = "https://github.com/oryon-dominik/interstellar-spectrograph/blob/trunk/CHANGES.md"

[project.optional-dependencies]
django = [
    "django>=6.1",
]

# Groups, not extras: a consumer never installs the linter or the test runner.
[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
test = [
    "pytest>=8.4.2",
    # The release numberer dates by a named time zone, and Windows ships no zone database.
    "tzdata>=2025.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 119
# No target-version: ruff reads requires-python above. A second declaration here
# would be a place for the two to drift apart.
# Markdown is not in the gate: documentation is prose, and its examples are illustrations.
# ruff's default include carries *.md (measured 0.16.1).
extend-exclude = ["*.md"]

[tool.ruff.lint]
# `extend-select`, not `select`: `select` replaces ruff's defaults, `extend-select`
# inherits them. What this project holds whatever a ruff release does with its defaults
# is named below.
extend-select = [
    "I", "UP", "B", "C4", "DJ",
    # pycodestyle. E2 and E3 are preview-only and would have no effect, so they
    # are not listed; E1 is stable and was covered by the old `select = ["E", ...]`.
    "E1",
    "E401", "E402", "E701", "E702", "E703", "E711", "E712", "E713", "E714",
    "E721", "E731", "E741", "E742", "E743",
    # Line length was never a ruff default, and line-length above wants to be held.
    "E501",
    # pyflakes wildcard-import family.
    "F403", "F405", "F406", "F722",
    # flake8-bandit in full — the defaults carry only part of it.
    "S",
    # flake8-datetimez in full — ruff 0.17 dropped seven of its rules from the defaults.
    "DTZ",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and migrations are written by makemigrations, never by hand — annotating
# one only makes the next generated one differ; a library can carry a Django part too.
# Every other suppression is inline, at the line it covers, with a reason.
"tests/**" = ["S101"]
"**/migrations/**" = ["RUF012", "E501"]
# The release numberer is the template's shared version.py, written to an
# isort layout which keeps two lines after the imports where this project keeps ruff's default.
"scripts/version.py" = ["I001"]

[tool.git-cliff.changelog]
header = """# spectrograph Changelog

"""
body = """
---

{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}](https://github.com/oryon-dominik/interstellar-spectrograph/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\
{% for scope, commits in commits | group_by(attribute="scope") %}
    ### {{ scope | striptags | trim | upper_first }}
    {% for group, commits in commits | group_by(attribute="group") %}
        #### {{ group | striptags | trim | upper_first }}
        {% for commit in commits
            | filter(attribute="scope")
            | filter(attribute="group")
            | sort(attribute="scope") %}
            - **({{commit.scope}})**{% if commit.breaking %} [**breaking**]{% endif %} \
                {{ commit.message }} - ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/oryon-dominik/interstellar-spectrograph/commit/{{ commit.id }}))
        {%- endfor -%}
        {% raw %}\n{% endraw %}\
    {% endfor %}\n
{% endfor %}\n

"""
footer = """
<!-- generated by @ci-bot via git-cliff -->
"""
# see [tool.git-cliff.git] section for more keys

[tool.git-cliff.git]
# A release tag is a CalVer number, optionally a prerelease of one. Without
# this, the moving `latest` tag counts as a release and every compare link
# points at it instead of the predecessor.
tag_pattern = '^[0-9]{4}\.[0-9]{1,2}\.[0-9]+((a|b|rc|post|dev)[0-9]+)?$'
conventional_commits = true
filter_unconventional = true
require_conventional = false
split_commits = false
commit_parsers = [
    # The changelog is read by users: what they cannot see stays in the history.
    { message = "^(build|chore|ci|docs|refactor|style|test)", skip = true },
    { message = "^feat", group = "Features"},
    { message = "^fix", group = "Bug Fixes"},
    { message = "^perf", group = "Performance"},
    { message = ".*", group = "Other", default_scope = "other"},
]
topo_order = false
sort_commits = "oldest"
# see [tool.git-cliff.changelog] section for more keys

[build-system]
requires = ["uv_build>=0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "spectrograph"
module-root = "src"

[tool.ty.rules]
# Lenient on unresolved imports.
unresolved-import = "warn"
